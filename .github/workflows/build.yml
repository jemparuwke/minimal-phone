name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS app
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Minimal.xcodeproj \
            -scheme Minimal \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            | tee build-simulator.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-simulator.log

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Minimal.xcodeproj \
            -scheme Minimal \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build-device.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-device.log

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Minimal.app Payload/
          zip -qry Minimal-unsigned.ipa Payload

      # Screenshots run when the commit message contains [shots], or on manual runs.
      - name: Capture screenshots
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shots]')
        run: scripts/screenshots.sh build-sim/Build/Products/Debug-iphonesimulator/Minimal.app

      - name: Commit screenshots
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shots]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes"
          else
            git commit -m "Update screenshots [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::Could not push screenshots (branch moved on)."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Minimal-unsigned-ipa
          path: Minimal-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build-*.log
